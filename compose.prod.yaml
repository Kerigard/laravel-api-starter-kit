x-logging: &logging
    options:
        max-size: 20m
        max-file: 5

x-app: &app
    image: laravel-api-starter-kit/app
    volumes:
        - storage:/var/www/html/storage
        - .env:/var/www/html/.env
    restart: unless-stopped
    logging: *logging

services:
    nginx:
        build:
            context: .
            dockerfile: ./.docker/nginx/Dockerfile
        depends_on:
            app:
                condition: service_started
        ports:
            - ${APP_PORT:-80}:80
        restart: unless-stopped
        logging: *logging

    app:
        <<: *app
        build:
            context: .
            dockerfile: ./.docker/app/Dockerfile
            target: production
        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy

    scheduler:
        <<: *app
        command: supercronic -passthrough-logs /etc/crontab
        depends_on:
            app:
                condition: service_started

    worker:
        <<: *app
        command: php artisan queue:work
        depends_on:
            app:
                condition: service_started

    pgsql:
        image: postgres:18-alpine
        environment:
            POSTGRES_DB: ${DB_DATABASE:-laravel}
            POSTGRES_USER: ${DB_USERNAME:-root}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
        volumes:
            - pgsql:/var/lib/postgresql/data
        healthcheck:
            test: pg_isready -q -d ${DB_DATABASE:-laravel} -U ${DB_USERNAME:-root}
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        ports:
            - ${FORWARD_DB_PORT:-5432}:5432
        restart: unless-stopped
        logging: *logging

    redis:
        image: redis:alpine
        command: --requirepass ${REDIS_PASSWORD:-secret}
        environment:
            REDISCLI_AUTH: ${REDIS_PASSWORD:-secret}
        volumes:
            - redis:/data
        healthcheck:
            test: redis-cli ping
            interval: 10s
            timeout: 3s
            retries: 5
            start_period: 5s
        ports:
            - ${FORWARD_REDIS_PORT:-6379}:6379
        restart: unless-stopped
        logging: *logging

volumes:
    storage:
    pgsql:
    redis:
